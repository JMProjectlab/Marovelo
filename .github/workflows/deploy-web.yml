name: Déployer l'application web

# Publie le dossier web/ sur GitHub Pages.
#
# Prérequis (une seule fois) : dans Settings → Pages du dépôt, régler
# « Source » sur « GitHub Actions ». Sans cela le déploiement échoue.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  # Permet de déclencher manuellement depuis l'onglet Actions,
  # y compris depuis une branche, pour prévisualiser avant fusion.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les commits suivants attendent leur tour
# plutôt que d'annuler un déploiement déjà lancé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier que les fichiers attendus sont présents
        run: |
          set -e
          for f in web/index.html web/css/styles.css web/js/app.js \
                   web/js/data.js web/js/domain.js web/js/store.js web/js/views.js \
                   web/js/accounts.js web/js/remote.js \
                   web/assets/logo-mark.svg web/assets/logo.jpg \
                   web/assets/hero-cyclistes.webp \
                   web/assets/home/velos.jpg web/assets/home/briere.jpg \
                   web/assets/home/cyclistes.jpg \
                   web/assets/bike-sm.jpg web/assets/bike-lxl.jpg \
                   brand/charte-graphique.html \
                   brand/assets/marque-simplifiee-mar-o-velo.svg; do
            test -f "$f" || { echo "::error::Fichier manquant : $f"; exit 1; }
          done
          echo "Tous les fichiers de l'application web sont présents."

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Assembler le site
        run: |
          set -e
          rm -rf _site
          cp -r web _site
          # La charte est publiée sous /charte/. Ses chemins sont relatifs
          # (./assets/...), donc son dossier d'images et de polices la suit
          # tel quel et rien n'est à réécrire dans le HTML.
          mkdir -p _site/charte
          cp brand/charte-graphique.html _site/charte/index.html
          cp -r brand/assets _site/charte/assets
          echo "Site assemblé :"
          du -sh _site _site/charte

      - name: Préparer l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
